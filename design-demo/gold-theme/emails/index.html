<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mutu emails · champagne-gold preview</title>
<style>
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#EFE9DC;color:#262626}
  header{padding:34px 40px 6px;max-width:1600px;margin:0 auto}
  .kick{display:inline-flex;gap:7px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8A6E1E;background:#F6EFDD;border:1px solid #E8D9A7;border-radius:99px;padding:5px 13px}
  h1{font-family:Georgia,serif;font-weight:600;font-size:26px;margin:13px 0 5px}
  p.lead{color:#6F6B62;font-size:14px;max-width:780px;line-height:1.55;margin:0}
  .grid{max-width:1600px;margin:22px auto 60px;padding:0 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:28px}
  .card{margin:0;background:#fff;border:1px solid #E4DCC9;border-radius:16px;overflow:hidden;box-shadow:0 16px 34px rgba(60,45,10,.08)}
  figcaption{font-size:13px;font-weight:700;padding:12px 15px;border-bottom:1px solid #EFEBE2;display:flex;justify-content:space-between;align-items:center;gap:8px}
  figcaption code{font-size:11px;font-weight:500;color:#A29C90}
  iframe{width:100%;height:640px;border:0;display:block;background:#EEE9E0}
</style></head><body>
<header>
  <span class="kick">◆ Email preview · new palette · not sent</span>
  <h1>Mutu emails — Champagne Gold</h1>
  <p class="lead">The transactional emails rendered with the new gold system (same recolor map as the app). The real template source in <code>api/_templates/*</code> is still untouched — this previews what applying it would produce.</p>
</header>
<div class="grid">
    <figure class="card">
      <figcaption>Welcome <code>welcome.js</code></figcaption>
      <iframe src="welcome.html" title="Welcome" loading="lazy"></iframe>
    </figure>
    <figure class="card">
      <figcaption>New match <code>match-notification.js</code></figcaption>
      <iframe src="match-notification.html" title="New match" loading="lazy"></iframe>
    </figure>
    <figure class="card">
      <figcaption>Event registration <code>event-registration.js</code></figcaption>
      <iframe src="event-registration.html" title="Event registration" loading="lazy"></iframe>
    </figure>
    <figure class="card">
      <figcaption>Event cancellation <code>event-cancellation.js</code></figcaption>
      <iframe src="event-cancellation.html" title="Event cancellation" loading="lazy"></iframe>
    </figure>
    <figure class="card">
      <figcaption>Events launch <code>events-launch.js</code></figcaption>
      <iframe src="events-launch.html" title="Events launch" loading="lazy"></iframe>
    </figure>
    <figure class="card">
      <figcaption>Event review (admin) <code>event-review.js</code></figcaption>
      <iframe src="event-review.html" title="Event review (admin)" loading="lazy"></iframe>
    </figure></div>
</body></html>
