<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mutu Practice Demo</title><style>body{margin:0;padding:12px;background:#fffdf6}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #687c48;outline-offset:3px}</style></head><body>
<style>

</div>

let current=0;let invited=[false,false,false];
const panel=root.querySelector('#mutu-profile');const reveal=root.querySelector('#mutu-reveal');const status=root.querySelector('#mutu-status');
function badges(items){return items.map(([label,count])=>`<span class="badge">✓ ${label} <small>· ${count} partners</small></span>`).join('')}
function renderPrivate(){
const example=privateExamples[current];const p=people[current];
const target=root.querySelector('#mutu-private-feedback');
if(!example){target.innerHTML='<h3>No ratings yet</h3><p>This fictional member has not completed a practice. No scores or Leadership badge are invented.</p>';return}
target.innerHTML=`<p class="sectionlabel">DEMO: VIEWING AS ${p.name.toUpperCase()}</p><h3>Your private skill feedback</h3><p>${example.category} · One mutually confirmed sample session</p><p>Only this member and their partner can see these ratings after both confirm. These are session observations, not an overall score.</p>
${example.ratings.map(([skill,score])=>`<div class="rating-row"><span>${skill}</span><strong>${score}/5</strong><small>${ratingAnchors[score-1]}</small></div>`).join('')}
${current===0?'<p>Leadership: guides the discussion, makes decisions and responds to input.</p>':''}
<details><summary>What do 1 to 5 mean?</summary><ol>${ratingAnchors.map(label=>`<li>${label}</li>`).join('')}</ol></details>
<p class="empty">Ratings are optional. Unobserved skills stay unrated. Numerical scores never appear on pool cards.</p>`;
}
function render(){const p=people[current];const known=reveal.checked;renderPrivate();
panel.innerHTML=`<div class="person"><img class="avatar" src="${avatars[current]}" alt="Mutu anonymous character avatar"><div><h3>${known?p.name:'Your next teammate'}</h3><p class="meta">${known?p.program:p.type+' practice · Rotman community'}</p><div class="identity">${known?'✓ Identity shared after mutual acceptance':'Identity hidden until you both accept'}</div></div></div>
<div class="stats"><div><strong>${p.sessions}</strong><span>practices completed</span></div><div><strong>${p.partners}</strong><span>different partners</span></div></div>
<div class="fit"><b>WHY YOU COULD HELP EACH OTHER</b>${p.fit}</div>
${p.skills.length?`<p class="sectionlabel">SKILLS RECOGNISED BY PARTNERS</p><div class="badges">${badges(p.skills)}</div>`:`<p class="sectionlabel">HAPPY TO HELP WITH</p><div class="badges"><span class="badge">${p.offer}</span></div><p class="empty">Chosen by this member · No partner feedback yet</p>`}
${p.traits.length?`<p class="sectionlabel">WHAT PARTNERS APPRECIATE</p><div class="badges qualities">${badges(p.traits)}</div>`:''}
<div class="response"><span aria-hidden="true">◷</span><div>${p.response||'No invitation response history yet'}<small>${p.response?'Accepting or declining both count · Last 90 days':'Their first practice is a chance to build a record.'}</small></div></div>
<details><summary>What these signals mean</summary><p>Practice totals count sessions confirmed by both people. Each partner counts once for each badge. Responsive is partner feedback about coordination. Invitation responses are recorded by Mutu and do not measure chat reply speed. Missing feedback does not mean poor performance.</p><p>Public evidence is shown with the member’s permission. Improvement tips and numerical skill ratings stay private. A numerical rating is not a badge; badge counts are distinct partners who recognised a strength. All records here are fictional demo examples.</p></details>
<button type="button" class="cta" id="mutu-action">${known?'Chat & plan →':invited[current]?'Invitation sent':'Invite to practise →'}</button><p class="foot">${known?'Continue in Mutu Messages':invited[current]?'Waiting for their acceptance':'One round for you. One round for them.'}</p>`;
root.querySelector('#mutu-action').onclick=()=>{if(known){status.textContent='Demo: this opens your existing conversation in Mutu Messages.'}else{invited[current]=true;render();status.textContent='Demo invitation sent. Toggle mutual acceptance to preview the identity reveal.'}};
root.querySelectorAll('[data-profile]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.profile)===current)));
}
root.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.profile);status.textContent='';render()});
reveal.onchange=()=>{status.textContent='';render()};render();
})();
