<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f5"/>
      <stop offset="1" stop-color="#efe8dc"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5C98B"/>
      <stop offset="0.5" stop-color="#C8A96A"/>
      <stop offset="1" stop-color="#A88245"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- interlocking rings -->
  <g transform="translate(230,250)" fill="none" stroke="url(#gold)" stroke-width="20">
    <circle cx="-52" cy="0" r="88"/>
    <circle cx="52" cy="0" r="88"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="470" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-weight="700" fill="#1a1a1a" letter-spacing="1">Mutu</text>
  <text x="474" y="300" font-family="Georgia, serif" font-size="34" fill="#A88245" letter-spacing="0.5">Ask for help. Match. Connect.</text>
  <text x="474" y="352" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6B6B6B">Your community, helping each other.</text>
</svg>
